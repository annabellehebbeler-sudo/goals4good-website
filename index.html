!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals4Good</title>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #1a2e1a;
    background: #fff;
    line-height: 1.7;
  }

  /* ── Color Palette ── */
  :root {
    --green-900: #0d3321;
    --green-800: #145232;
    --green-700: #1a6b42;
    --green-600: #208550;
    --green-500: #28a463;
    --green-400: #3dc47e;
    --green-100: #e6f7ef;
    --green-50:  #f2fbf6;
    --teal-500:  #0d9488;
    --teal-100:  #ccfbf1;
    --accent:    #f59e0b;
    --text-dark: #0f1e10;
    --text-mid:  #374a38;
    --text-light:#6b7c6c;
    --border:    #d1e8d8;
    --white:     #ffffff;
  }

  /* ── Navigation ── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: var(--green-900);
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .nav-inner {
    max-width: 1160px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem; height: 64px;
  }
  .nav-logo {
    font-size: 1.35rem; font-weight: 800; color: var(--white);
    text-decoration: none; letter-spacing: -0.02em;
  }
  .nav-logo span { color: var(--green-400); }
  .nav-links {
    display: flex; gap: 0.25rem; list-style: none;
  }
  .nav-links a {
    color: rgba(255,255,255,0.82); text-decoration: none;
    font-size: 0.88rem; font-weight: 500; padding: 0.45rem 0.75rem;
    border-radius: 6px; transition: background 0.18s, color 0.18s;
    white-space: nowrap;
  }
  .nav-links a:hover { background: rgba(255,255,255,0.12); color: #fff; }

  /* ── Page offset for fixed nav ── */
  section { scroll-margin-top: 64px; }

  /* ── Shared layout helpers ── */
  .container { max-width: 1060px; margin: 0 auto; padding: 0 2rem; }
  .section-label {
    display: inline-block;
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--green-600);
    margin-bottom: 0.6rem;
  }
  .section-title {
    font-size: clamp(1.85rem, 3.5vw, 2.75rem);
    font-weight: 800; color: var(--green-900); line-height: 1.2;
    margin-bottom: 1rem;
  }
  .section-subtitle {
    font-size: 1.1rem; color: var(--text-mid); max-width: 640px; margin-bottom: 2.5rem;
  }
  .divider {
    width: 56px; height: 4px; background: var(--green-500);
    border-radius: 2px; margin: 1rem 0 2rem;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-block; padding: 0.75rem 2rem;
    border-radius: 8px; font-weight: 700; font-size: 0.95rem;
    text-decoration: none; transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer; border: none;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.18); }
  .btn-primary { background: var(--green-600); color: #fff; }
  .btn-outline { background: transparent; color: var(--green-800); border: 2px solid var(--green-600); }
  .btn-white  { background: #fff; color: var(--green-800); }
  .btn-accent { background: var(--accent); color: #fff; }

  /* ══════════════════════════════════
     SECTION 1 — HOME / HERO
  ══════════════════════════════════ */
  #home {
    background: linear-gradient(rgba(13,51,33,0.80), rgba(26,107,66,0.72)), url('https://lh3.googleusercontent.com/sitesv/AG8ngQUPpX-CGVBOQ2H0nnFF07fIY882jfecXaNb_3T5fORY7Nv9w-pR0HG3PJ_yX3gd37EOucaElY9RsqIwfbS0FK6Q8u5y1-cuMUkbS6vXNEHKPe8GhgaMUtMh80nI0pL5TFnxcklAifwrbeik6I23A1TXuigydjjKn3QSmMMcxrejpiVC49k2N2jAhm22n7z4WH4Nf4BiXuBJWtwmxDmvUKiyAZKflD8279RmmYy8=w1280') center/cover no-repeat;
    padding: 120px 0 80px; min-height: 80vh;
    display: flex; align-items: center;
  }
  .hero-inner {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;
  }
  .hero-text h1 {
    font-size: clamp(2.5rem, 5vw, 3.8rem); font-weight: 900;
    color: #fff; line-height: 1.1; margin-bottom: 0.5rem;
    letter-spacing: -0.03em;
  }
  .hero-text h1 em { color: var(--green-400); font-style: normal; }
  .hero-text .hero-tagline {
    font-size: 1.2rem; color: rgba(255,255,255,0.88);
    margin: 1rem 0 2rem; line-height: 1.6;
  }
  .hero-btns { display: flex; gap: 1rem; flex-wrap: wrap; }
  .hero-card {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(12px); border-radius: 16px;
    padding: 2.5rem 2rem; color: #fff;
  }
  .hero-card h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: var(--green-400); }
  .hero-card p { font-size: 0.98rem; line-height: 1.7; color: rgba(255,255,255,0.9); }

  /* How We Help cards */
  .how-section { padding: 80px 0; background: var(--green-50); }
  .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 2.5rem; }
  .card {
    background: #fff; border-radius: 14px; padding: 2rem;
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(20,82,50,0.06);
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .card:hover { box-shadow: 0 8px 28px rgba(20,82,50,0.13); transform: translateY(-3px); }
  .card-icon {
    width: 48px; height: 48px; border-radius: 12px;
    background: var(--green-100); display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; margin-bottom: 1rem;
  }
  .card h3 { font-size: 1.15rem; font-weight: 700; color: var(--green-900); margin-bottom: 0.5rem; }
  .card p  { font-size: 0.95rem; color: var(--text-mid); }

  /* CTA Banner */
  .cta-banner {
    background: linear-gradient(90deg, var(--green-800), var(--teal-500));
    padding: 64px 0; text-align: center;
  }
  .cta-banner h2 {
    font-size: clamp(1.4rem, 2.5vw, 2rem); font-weight: 800;
    color: #fff; text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 1.75rem;
  }
  .cta-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

  /* ══════════════════════════════════
     SECTION 2 — ABOUT US
  ══════════════════════════════════ */
  #about { padding: 80px 0; background: #fff; }
  .about-story {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4rem;
    align-items: start; margin-bottom: 4rem;
  }
  .about-story p { font-size: 1.05rem; color: var(--text-mid); line-height: 1.8; }
  .about-vision {
    background: var(--green-100); border-left: 4px solid var(--green-500);
    border-radius: 0 12px 12px 0; padding: 1.5rem 1.75rem;
    font-size: 1.05rem; color: var(--green-900); font-style: italic;
    margin-top: 1.5rem;
  }
  .team-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 2.5rem;
  }
  .team-photo {
  width: 100%;
  max-width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 50%;
  display: block;
  margin: 0 auto 0.85rem;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  border: 3px solid var(--green-100);
}
.team-card {
    text-align: center; background: var(--green-50);
    border: 1px solid var(--border); border-radius: 14px; padding: 1.75rem 1.25rem;
  }
  .team-avatar {
    width: 68px; height: 68px; border-radius: 50%;
    background: linear-gradient(135deg, var(--green-600), var(--teal-500));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; color: #fff; font-weight: 700;
    margin: 0 auto 0.85rem;
  }
  .team-card h4 { font-size: 1rem; font-weight: 700; color: var(--green-900); }
  .team-card span { font-size: 0.85rem; color: var(--text-light); }

  /* ══════════════════════════════════
     SECTION 3 — SCHOLARSHIP INFO
  ══════════════════════════════════ */
  #scholarships { padding: 80px 0; background: var(--green-50); }
  .steps-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-bottom: 3rem;
  }
  .step-card {
    background: #fff; border-radius: 14px; padding: 2rem;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(20,82,50,0.06);
    display: flex; gap: 1.25rem; align-items: flex-start;
  }
  .step-num {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
    background: var(--green-600); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1rem;
  }
  .step-card h3 { font-size: 1.05rem; font-weight: 700; color: var(--green-900); margin-bottom: 0.4rem; }
  .step-card p  { font-size: 0.93rem; color: var(--text-mid); line-height: 1.65; }
  .scholarship-note {
    background: #fff; border-radius: 14px; padding: 2rem 2.5rem;
    border: 1px solid var(--border); margin-top: 1rem;
  }
  .scholarship-note p { font-size: 1rem; color: var(--text-mid); line-height: 1.8; margin-bottom: 0.75rem; }
  .scholarship-note p:last-child { margin-bottom: 0; }

  /* ══════════════════════════════════
     SECTION 4 — GET INVOLVED
  ══════════════════════════════════ */
  #get-involved { padding: 80px 0; background: #fff; }
  .involve-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 3rem;
  }
  .involve-card {
    border-radius: 14px; padding: 2.25rem 1.75rem; text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(20,82,50,0.06);
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .involve-card:hover { box-shadow: 0 8px 28px rgba(20,82,50,0.13); transform: translateY(-3px); }
  .involve-card.green-bg { background: var(--green-600); border-color: var(--green-600); }
  .involve-card.green-bg h3, .involve-card.green-bg p { color: #fff; }
  .involve-card.light-bg { background: var(--green-50); }
  .involve-icon { font-size: 2.2rem; margin-bottom: 1rem; }
  .involve-card h3 { font-size: 1.2rem; font-weight: 700; color: var(--green-900); margin-bottom: 0.5rem; }
  .involve-card p  { font-size: 0.95rem; color: var(--text-mid); line-height: 1.65; }
  .partner-types {
    display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; margin-top: 1rem;
  }
  .partner-tag {
    background: rgba(255,255,255,0.2); color: #fff;
    padding: 0.3rem 0.9rem; border-radius: 999px;
    font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(255,255,255,0.35);
  }
  .partners-box {
    background: var(--green-50); border: 1px solid var(--border);
    border-radius: 14px; padding: 2rem 2.5rem;
  }
  .partners-box h3 { font-size: 1.1rem; font-weight: 700; color: var(--green-900); margin-bottom: 0.6rem; }
  .partners-box p  { font-size: 0.97rem; color: var(--text-mid); }
  .partners-box a  { color: var(--green-700); font-weight: 600; }

  /* ══════════════════════════════════
     SECTION 5 — UPCOMING EVENTS
  ══════════════════════════════════ */
  #events { padding: 80px 0; background: var(--green-50); }
  .events-empty {
    background: #fff; border-radius: 16px; padding: 4rem 2rem;
    text-align: center; border: 2px dashed var(--border);
  }
  .events-empty .big-icon { font-size: 3rem; margin-bottom: 1rem; }
  .events-empty h3 { font-size: 1.3rem; font-weight: 700; color: var(--green-900); margin-bottom: 0.5rem; }
  .events-empty p  { color: var(--text-light); }

  /* ══════════════════════════════════
     SECTION 6 — OUR IMPACT
  ══════════════════════════════════ */
  #impact { padding: 80px 0; background: #fff; }
  .impact-goal {
    background: linear-gradient(135deg, var(--green-900), var(--teal-500));
    border-radius: 16px; padding: 3rem; color: #fff;
    text-align: center; margin-bottom: 3rem;
  }
  .impact-goal h3 { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.75rem; }
  .impact-goal p  { font-size: 1.05rem; color: rgba(255,255,255,0.88); max-width: 600px; margin: 0 auto; }
  .stats-row {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;
  }
  .stat-card {
    background: var(--green-50); border: 1px solid var(--border);
    border-radius: 14px; padding: 2.5rem; text-align: center;
  }
  .stat-card .stat-label {
    font-size: 1rem; font-weight: 700; color: var(--green-800); margin-bottom: 0.5rem;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .stat-card .stat-value {
    font-size: 2.5rem; font-weight: 900; color: var(--green-600);
  }
  .stat-card .stat-sub { font-size: 0.88rem; color: var(--text-light); margin-top: 0.25rem; }

  /* ══════════════════════════════════
     SECTION 7 — FAQs
  ══════════════════════════════════ */
  #faqs { padding: 80px 0; background: var(--green-50); }
  .faq-list { max-width: 780px; margin: 0 auto; }
  .faq-item {
    background: #fff; border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 1rem; overflow: hidden;
  }
  .faq-q {
    width: 100%; background: none; border: none; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.25rem 1.5rem; text-align: left;
    font-size: 1rem; font-weight: 700; color: var(--green-900);
    font-family: inherit;
  }
  .faq-q:hover { background: var(--green-50); }
  .faq-q .faq-icon {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
    background: var(--green-100); color: var(--green-700);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; font-weight: 800; transition: transform 0.2s;
  }
  .faq-item.open .faq-icon { transform: rotate(45deg); }
  .faq-a {
    display: none; padding: 0 1.5rem 1.25rem;
    font-size: 0.97rem; color: var(--text-mid); line-height: 1.7;
    border-top: 1px solid var(--border);
  }
  .faq-a a { color: var(--green-700); font-weight: 600; }
  .faq-item.open .faq-a { display: block; }
  .faq-contact {
    text-align: center; margin-top: 2.5rem;
    font-size: 1rem; color: var(--text-mid);
  }
  .faq-contact a { color: var(--green-700); font-weight: 700; }

  /* ── Footer ── */
  footer {
    background: var(--green-900); color: rgba(255,255,255,0.75);
    padding: 2.5rem 0; text-align: center; font-size: 0.88rem;
  }
  footer strong { color: #fff; }

  /* ── Images ── */

  /* ── Responsive ── */
  @media (max-width: 820px) {
    .hero-inner, .about-story { grid-template-columns: 1fr; gap: 2rem; }
    .cards-grid, .team-grid, .involve-grid, .steps-grid, .stats-row { grid-template-columns: 1fr; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>
